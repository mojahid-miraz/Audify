<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Murmur">
<meta name="theme-color" content="#14111d">
<title>Murmur Local</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<style>
:root {
  --bg: #14111d;
  --card: #201b30;
  --card2: #2b2540;
  --ink: #f4efe7;
  --dim: #a79fb8;
  --acc: #8f84ff;
  --acc2: #ffb86b;
  --top: env(safe-area-inset-top, 0px);
  --bot: env(safe-area-inset-bottom, 0px);
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: "Bricolage Grotesque", system-ui, -apple-system, sans-serif;
  overflow: hidden;
  overscroll-behavior: none;
}
button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
svg {
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
svg.f {
  fill: currentColor;
  stroke: none;
}
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
}
#view {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: calc(var(--top) + 16px) 16px 20px;
}
h1 {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.02em;
}
h2 {
  font-size: 19px;
  font-weight: 700;
  margin: 26px 0 12px;
}
.dim { color: var(--dim); }
.head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.art {
  background-size: cover;
  background-position: center;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 20px;
  color: #ffffffb0;
  flex: none;
  border-radius: 6px;
  width: 52px;
  height: 52px;
  background-color: var(--card2);
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.tile {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--card);
  border-radius: 8px;
  overflow: hidden;
  text-align: left;
  min-height: 54px;
  font-weight: 600;
  font-size: 13.5px;
  line-height: 1.2;
}
.tile .art {
  width: 54px;
  height: 54px;
  border-radius: 0;
}
.tile span {
  padding-right: 8px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.shelf {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  margin: 0 -16px;
  padding: 0 16px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.shelf::-webkit-scrollbar { display: none; }
.card {
  flex: none;
  width: 138px;
  text-align: left;
  flex-direction: column;
  align-items: flex-start;
}
.card .art {
  width: 138px;
  height: 138px;
  border-radius: 8px;
  font-size: 42px;
}
.card b {
  display: block;
  margin-top: 8px;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  width: 100%;
}
small {
  display: block;
  color: var(--dim);
  font-size: 12.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  width: 100%;
}
.row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 6px 0;
  cursor: pointer;
}
.row .t {
  flex: 1;
  min-width: 0;
}
.row b {
  display: block;
  font-weight: 600;
  font-size: 15px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row.on b { color: var(--acc); }
.row.round .art { border-radius: 50%; }
.ic {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  color: var(--dim);
  flex: none;
  border-radius: 50%;
}
.ic:active { transform: scale(0.92); }
.ic.liked { color: var(--acc2); }
.ic.liked svg { fill: currentColor; }
.chips {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  overflow-x: auto;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  padding: 7px 16px;
  border-radius: 99px;
  background: var(--card);
  font-size: 13.5px;
  font-weight: 600;
  flex: none;
}
.chip.on {
  background: var(--acc);
  color: #14111d;
}
.search {
  width: 100%;
  padding: 13px 16px;
  border-radius: 10px;
  border: 1.5px solid transparent;
  background: var(--card);
  color: var(--ink);
  outline: 0;
  margin: 12px 0 6px;
  font: inherit;
  user-select: text;
}
.search:focus { border-color: var(--acc); }
.btn {
  background: var(--acc);
  color: #14111d;
  font-weight: 800;
  padding: 12px 24px;
  border-radius: 99px;
  font-size: 14px;
}
.btn.alt {
  background: var(--card2);
  color: var(--ink);
}
.btns {
  display: flex;
  gap: 10px;
  margin: 14px 0;
}
.back {
  font-size: 15px;
  color: var(--dim);
  padding: 6px 0 10px;
  font-weight: 600;
}
.empty {
  padding-top: 12vh;
  text-align: center;
}
.empty p {
  color: var(--dim);
  line-height: 1.5;
  margin: 12px auto 24px;
  max-width: 320px;
  font-size: 15px;
}

/* Mini Player */
#mini {
  margin: 0 8px 6px;
  border-radius: 12px;
  background: var(--card2);
  padding: 8px 10px 0;
  display: none;
  overflow: hidden;
  box-shadow: 0 4px 12px #0004;
}
#mini .top {
  display: flex;
  align-items: center;
  gap: 10px;
}
#mini .art {
  width: 44px;
  height: 44px;
}
#mini .meta {
  flex: 1;
  min-width: 0;
}
#mini b {
  display: block;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bar {
  height: 2.5px;
  margin: 8px -10px 0;
  background: #ffffff1f;
}
.bar i {
  display: block;
  height: 100%;
  width: 0%;
  background: var(--acc);
}

/* Nav */
nav {
  display: flex;
  padding: 6px 0 calc(var(--bot) + 4px);
  background: var(--bg);
  border-top: 1px solid #ffffff0d;
}
nav button {
  flex: 1;
  display: grid;
  justify-items: center;
  gap: 3px;
  font-size: 11px;
  color: var(--dim);
  padding: 4px;
  font-weight: 600;
}
nav button.on { color: var(--ink); }
nav svg { width: 22px; height: 22px; }

/* Full Now Playing */
#np {
  position: fixed;
  inset: 0;
  background: linear-gradient(180deg, var(--np, #3a2f6b), var(--bg) 75%);
  padding: calc(var(--top) + 12px) 24px calc(var(--bot) + 20px);
  display: flex;
  flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 20;
}
#np.open { transform: none; }
#np .art {
  width: 100%;
  height: auto;
  aspect-ratio: 1;
  max-width: 320px;
  max-height: 40vh;
  border-radius: 12px;
  margin: auto;
  font-size: 84px;
  box-shadow: 0 16px 36px #0009;
}
#np .tt {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 20px;
}
#np .tt div {
  flex: 1;
  min-width: 0;
}
#np .tt b {
  font-size: 21px;
  font-weight: 800;
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
input[type=range] {
  -webkit-appearance: none;
  width: 100%;
  margin: 16px 0 2px;
  background: transparent;
  accent-color: var(--acc);
}
input[type=range]::-webkit-slider-runnable-track {
  height: 4px;
  background: #ffffff26;
  border-radius: 2px;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  background: var(--ink);
  border-radius: 50%;
  margin-top: -5px;
}
.times {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--dim);
}
.ctl {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 14px 0 8px;
}
.ctl .ic {
  width: 46px;
  height: 46px;
  color: var(--ink);
}
.ctl .ic.on { color: var(--acc); }
.big {
  width: 64px !important;
  height: 64px !important;
  border-radius: 50%;
  background: var(--ink);
  color: #14111d !important;
}

/* Modals & Action Sheets */
#sheetbg {
  position: fixed;
  inset: 0;
  background: #0009;
  display: none;
  z-index: 30;
  align-items: flex-end;
}
#sheet {
  width: 100%;
  background: var(--card);
  border-radius: 18px 18px 0 0;
  padding: 16px 16px calc(var(--bot) + 16px);
  max-height: 75vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
#sheet h3 {
  font-size: 16px;
  margin-bottom: 8px;
  font-weight: 700;
  padding: 0 4px;
}
#sheet button {
  width: 100%;
  text-align: left;
  padding: 14px 4px;
  font-size: 15px;
  border-top: 1px solid #ffffff12;
  justify-content: flex-start;
}
#toast {
  position: fixed;
  left: 50%;
  bottom: calc(140px + var(--bot));
  transform: translateX(-50%);
  background: var(--ink);
  color: #14111d;
  padding: 10px 18px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  z-index: 40;
  text-align: center;
  max-width: 88%;
  box-shadow: 0 4px 14px #0006;
}
#toast.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  
  <div id="mini">
    <div class="top">
      <div class="art" id="mArt"></div>
      <div class="meta"><b id="mT"></b><small id="mA"></small></div>
      <button class="ic" data-c="prev" aria-label="Previous"></button>
      <button class="ic" data-c="toggle" aria-label="Play or pause" id="mTog"></button>
      <button class="ic" data-c="next" aria-label="Next"></button>
    </div>
    <div class="bar"><i id="mBar"></i></div>
  </div>

  <nav id="nav"></nav>
</div>

<section id="np" aria-label="Now playing">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <button class="ic" id="npClose" aria-label="Close" style="color:var(--ink)"></button>
    <small style="text-transform:uppercase; font-size:11px; font-weight:800; letter-spacing:0.05em; color:var(--dim)">Playing from local</small>
    <button class="ic" id="npQueue" aria-label="Queue" style="color:var(--ink)"></button>
  </div>
  <div class="art" id="nArt"></div>
  <div class="tt">
    <div><b id="nT"></b><small id="nA" style="font-size:15px"></small></div>
    <button class="ic" id="nLike" aria-label="Like"></button>
  </div>
  <input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Seek">
  <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
  <div class="ctl">
    <button class="ic" data-c="shuffle" id="bShuf" aria-label="Shuffle"></button>
    <button class="ic" data-c="prev" aria-label="Previous"></button>
    <button class="ic big" data-c="toggle" id="nTog" aria-label="Play or pause"></button>
    <button class="ic" data-c="next" aria-label="Next"></button>
    <button class="ic" data-c="repeat" id="bRep" aria-label="Repeat"></button>
  </div>
</section>

<div id="sheetbg"><div id="sheet"></div></div>
<div id="toast"></div>
<input type="file" id="pick" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac" multiple hidden>

<script>
const $ = s => document.querySelector(s), V = $('#view');
const I = {
  play: '<svg class="f" viewBox="0 0 24 24" width="28" height="28"><path d="M7 4l13 8-13 8z"/></svg>',
  pause: '<svg class="f" viewBox="0 0 24 24" width="28" height="28"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  next: '<svg class="f" viewBox="0 0 24 24" width="22" height="22"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>',
  prev: '<svg class="f" viewBox="0 0 24 24" width="22" height="22"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>',
  heart: '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/></svg>',
  more: '<svg class="f" viewBox="0 0 24 24" width="20" height="20"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  shuf: '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 7h4c5 0 5 10 10 10h4M3 17h4c1.5 0 2.5-.8 3.3-2M14 8c.8-.7 1.8-1 3-1h4M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>',
  rep: '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M17 3l3 3-3 3M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 0 1-3 3H4"/></svg>',
  down: '<svg viewBox="0 0 24 24" width="26" height="26"><path d="M5 9l7 7 7-7"/></svg>',
  plus: '<svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 5v14M5 12h14"/></svg>',
  home: '<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  lib: '<svg viewBox="0 0 24 24"><path d="M5 4v16M10 4v16M15 5l5 14"/></svg>',
  queue: '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h12"/></svg>'
};

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch (e) { return d } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} }
};
const toast = m => {
  const t = $('#toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2400);
};
const fmt = s => {
  s = Math.floor(s || 0);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
};

/* ---------- Storage: IndexedDB ---------- */
let db, songs = [];
const openDB = () => new Promise((res, rej) => {
  const r = indexedDB.open('murmur-local', 2);
  r.onupgradeneeded = e => {
    const d = r.result;
    if (!d.objectStoreNames.contains('songs')) d.createObjectStore('songs', { keyPath: 'id' });
    if (!d.objectStoreNames.contains('files')) d.createObjectStore('files');
  };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});

const tx = (stores, mode, fn) => new Promise((res, rej) => {
  const t = db.transaction(stores, mode);
  const q = fn(t);
  t.oncomplete = () => res(q && q.result);
  t.onerror = () => rej(t.error);
});

const byId = id => songs.find(s => s.id === id);
const withUrl = s => {
  if (s.cover && !s.coverUrl) {
    try { s.coverUrl = URL.createObjectURL(s.cover); } catch (e) { s.coverUrl = ''; }
  }
  return s;
};

let likes = ls.get('likes', []), playlists = ls.get('playlists', []);
const liked = id => likes.includes(id);
const saveLikes = () => ls.set('likes', likes), savePl = () => ls.set('playlists', playlists);

/* ---------- Import Tags & Audio Processing ---------- */
const readTags = f => new Promise(res => {
  if (!window.jsmediatags) return res({});
  jsmediatags.read(f, {
    onSuccess: ({ tags }) => {
      let cover = null;
      if (tags.picture) {
        cover = new Blob([new Uint8Array(tags.picture.data)], { type: tags.picture.format || 'image/jpeg' });
      }
      res({ title: tags.title, artist: tags.artist, album: tags.album, cover });
    },
    onError: () => res({})
  });
});

const getDur = b => new Promise(res => {
  const a = new Audio(), u = URL.createObjectURL(b);
  const done = d => { URL.revokeObjectURL(u); res(d); };
  a.preload = 'metadata';
  a.onloadedmetadata = () => done(a.duration || 0);
  a.onerror = () => done(0);
  setTimeout(() => done(0), 4000);
  a.src = u;
});

async function importFiles(files) {
  files = [...files];
  let n = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    toast(`Importing ${i + 1}/${files.length}…`);
    try {
      const id = f.name + '|' + f.size;
      if (byId(id)) continue;
      const ext = (f.name.split('.').pop() || '').toLowerCase();
      const type = f.type || ({ m4a: 'audio/mp4', mp3: 'audio/mpeg', wav: 'audio/wav', flac: 'audio/flac', aac: 'audio/aac' })[ext] || 'audio/mpeg';
      
      const buffer = await f.arrayBuffer();
      const blob = new Blob([buffer], { type });
      const tags = await readTags(f);
      const dur = await getDur(blob);
      
      const s = {
        id,
        title: (tags.title || f.name.replace(/\.[^.]+$/, '')).trim(),
        artist: (tags.artist || 'Unknown Artist').trim(),
        album: (tags.album || 'Unknown Album').trim(),
        dur,
        cover: tags.cover || null,
        added: Date.now()
      };
      
      await tx(['songs', 'files'], 'readwrite', t => {
        t.objectStore('songs').put(s);
        t.objectStore('files').put(blob, id);
      });
      songs.push(withUrl(s));
      n++;
    } catch (e) {
      console.error(e);
    }
  }
  toast(n ? `Added ${n} song${n > 1 ? 's' : ''}` : 'No new tracks imported');
  render();
}

$('#pick').onchange = e => {
  if (e.target.files.length) importFiles(e.target.files);
  e.target.value = '';
};
const pickFiles = () => $('#pick').click();

async function removeSong(id) {
  const s = byId(id);
  if (s && s.coverUrl) URL.revokeObjectURL(s.coverUrl);
  await tx(['songs', 'files'], 'readwrite', t => {
    t.objectStore('songs').delete(id);
    t.objectStore('files').delete(id);
  });
  songs = songs.filter(s => s.id !== id);
  likes = likes.filter(x => x !== id);
  saveLikes();
  playlists.forEach(p => { p.ids = p.ids.filter(x => x !== id); });
  savePl();
  queue = queue.filter(x => x !== id);
  render();
}

/* ---------- Visual Identity ---------- */
const hue = str => {
  let h = 0;
  for (const c of String(str)) h = (h * 31 + c.charCodeAt(0)) % 360;
  return h;
};
const grad = str => {
  const h = hue(str);
  return `linear-gradient(135deg, hsl(${h} 50% 35%), hsl(${(h + 50) % 360} 55% 18%))`;
};
const art = (s, extra = '') => {
  if (s && s.coverUrl) return `<div class="art" style="background-image:url('${s.coverUrl}');${extra}"></div>`;
  const label = s ? (s.title || '♪').trim()[0] : '♪';
  return `<div class="art" style="background:${grad(s ? s.title : 'x')};${extra}">${esc(label)}</div>`;
};
const likeArt = '<div class="art" style="background:linear-gradient(135deg,#8f84ff,#ffb86b)">♥</div>';

/* ---------- Player Core Engine ---------- */
const au = new Audio();
au.preload = 'auto';
au.setAttribute('playsinline', '');

let queue = [], qi = -1, hist = [], shuffle = false, repeat = 0, curUrl = '', seeking = false, unlocked = false;
const cur = () => byId(queue[qi]);

const unlockAudio = () => {
  if (unlocked) return;
  unlocked = true;
  au.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=';
  au.play().catch(() => {});
};
document.addEventListener('touchend', unlockAudio, { once: true, passive: true });
document.addEventListener('click', unlockAudio, { once: true });

async function load(i) {
  const s = byId(queue[i]);
  if (!s) return;
  qi = i;
  
  const blob = await tx('files', 'readonly', t => t.objectStore('files').get(s.id));
  if (!blob) {
    toast('Track data missing from device.');
    return;
  }
  
  if (curUrl) URL.revokeObjectURL(curUrl);
  curUrl = URL.createObjectURL(blob);
  au.src = curUrl;
  
  try {
    await au.play();
  } catch (e) {
    paint();
  }
  
  const r = ls.get('recent', []).filter(x => x !== s.id);
  r.unshift(s.id);
  ls.set('recent', r.slice(0, 25));
  
  paint();
  setSession(s);
}

function playQueue(ids, i = 0) {
  queue = ids.slice();
  hist = [];
  load(i);
}

function next(auto = false) {
  if (!queue.length) return;
  if (auto && repeat === 2) {
    au.currentTime = 0;
    au.play();
    return;
  }
  let i;
  if (shuffle && queue.length > 1) {
    do { i = Math.floor(Math.random() * queue.length); } while (i === qi);
  } else {
    i = qi + 1;
    if (i >= queue.length) {
      if (repeat === 1 || !auto) i = 0;
      else {
        au.pause();
        paint();
        return;
      }
    }
  }
  hist.push(qi);
  load(i);
}

function prev() {
  if (au.currentTime > 3) {
    au.currentTime = 0;
    return;
  }
  if (hist.length) load(hist.pop());
  else load(Math.max(0, qi - 1));
}

const toggle = () => {
  if (!cur()) return;
  au.paused ? au.play() : au.pause();
};

au.onended = () => next(true);
au.onplay = au.onpause = () => {
  paint();
  if ('mediaSession' in navigator) {
    navigator.mediaSession.playbackState = au.paused ? 'paused' : 'playing';
  }
};

au.ontimeupdate = () => {
  const d = au.duration || 0;
  const p = d ? (au.currentTime / d) * 100 : 0;
  $('#mBar').style.width = p + '%';
  if (!seeking) {
    $('#seek').value = p;
    $('#tCur').textContent = fmt(au.currentTime);
  }
  $('#tDur').textContent = fmt(d);
  
  if ('mediaSession' in navigator && !isNaN(au.duration) && au.duration > 0) {
    try {
      navigator.mediaSession.setPositionState({
        duration: au.duration,
        playbackRate: au.playbackRate,
        position: au.currentTime
      });
    } catch (e) {}
  }
};

$('#seek').oninput = e => {
  seeking = true;
  $('#tCur').textContent = fmt(((au.duration || 0) * e.target.value) / 100);
};
$('#seek').onchange = e => {
  au.currentTime = ((au.duration || 0) * e.target.value) / 100;
  seeking = false;
};

function setSession(s) {
  if (!('mediaSession' in navigator)) return;
  const artwork = s.coverUrl ? [{ src: s.coverUrl, sizes: '512x512', type: s.cover ? s.cover.type : 'image/jpeg' }] : [];
  navigator.mediaSession.metadata = new MediaMetadata({
    title: s.title,
    artist: s.artist,
    album: s.album,
    artwork
  });
  
  const handlers = {
    play: () => au.play(),
    pause: () => au.pause(),
    previoustrack: prev,
    nexttrack: () => next(false),
    seekto: e => { if (e.seekTime != null) au.currentTime = e.seekTime; }
  };
  for (const k in handlers) {
    try { navigator.mediaSession.setActionHandler(k, handlers[k]); } catch (e) {}
  }
}

function paint() {
  const s = cur();
  $('#mini').style.display = s ? 'block' : 'none';
  if (!s) return;
  
  const pl = !au.paused;
  $('#mArt').outerHTML = art(s).replace('class="art"', 'class="art" id="mArt"');
  $('#nArt').outerHTML = art(s).replace('class="art"', 'class="art" id="nArt"');
  $('#mT').textContent = s.title;
  $('#mA').textContent = s.artist;
  $('#nT').textContent = s.title;
  $('#nA').textContent = s.artist;
  
  $('#np').style.setProperty('--np', `hsl(${hue(s.title)} 45% 26%)`);
  $('#mTog').innerHTML = $('#nTog').innerHTML = pl ? I.pause : I.play;
  $('#nLike').className = 'ic' + (liked(s.id) ? ' liked' : '');
  
  $('#bShuf').classList.toggle('on', shuffle);
  $('#bRep').classList.toggle('on', repeat > 0);
  $('#bRep').title = ['Repeat off', 'Repeat all', 'Repeat one'][repeat];
  
  document.querySelectorAll('.row[data-id]').forEach(r => {
    r.classList.toggle('on', r.dataset.id === s.id);
  });
}

document.addEventListener('click', e => {
  const c = e.target.closest('[data-c]')?.dataset.c;
  if (!c) return;
  if (c === 'toggle') toggle();
  else if (c === 'next') next(false);
  else if (c === 'prev') prev();
  else if (c === 'shuffle') {
    shuffle = !shuffle;
    toast(shuffle ? 'Shuffle on' : 'Shuffle off');
    paint();
  } else if (c === 'repeat') {
    repeat = (repeat + 1) % 3;
    toast(['Repeat off', 'Repeat all', 'Repeat one'][repeat]);
    paint();
  }
});

$('#mini').addEventListener('click', e => {
  if (!e.target.closest('[data-c]')) $('#np').classList.add('open');
});
$('#npClose').onclick = () => $('#np').classList.remove('open');
$('#nLike').onclick = () => { const s = cur(); if (s) toggleLike(s.id); };

$('#npQueue').onclick = () => {
  const items = queue.map((id, index) => {
    const s = byId(id);
    return [
      (index === qi ? '▶ ' : '') + (s ? s.title : 'Unknown'),
      () => load(index)
    ];
  });
  sheet('Up Next', items);
};

function toggleLike(id) {
  likes = liked(id) ? likes.filter(x => x !== id) : [id, ...likes];
  saveLikes();
  document.querySelectorAll(`[data-like="${CSS.escape(id)}"]`).forEach(b => {
    b.classList.toggle('liked', liked(id));
  });
  paint();
  if (route.d && route.d.kind === 'liked') render();
}

/* ---------- Sheet / Context Menu ---------- */
function sheet(title, items) {
  const sh = $('#sheet');
  sh.innerHTML = `<h3>${esc(title)}</h3>` + items.map((it, i) => `<button data-s="${i}">${esc(it[0])}</button>`).join('');
  $('#sheetbg').style.display = 'flex';
  sh.onclick = e => {
    const b = e.target.closest('[data-s]');
    if (!b) return;
    closeSheet();
    items[+b.dataset.s][1]();
  };
}
const closeSheet = () => { $('#sheetbg').style.display = 'none'; };
$('#sheetbg').onclick = e => { if (e.target.id === 'sheetbg') closeSheet(); };

function newPlaylist(thenAdd) {
  const name = (prompt('Playlist name:') || '').trim();
  if (!name) return;
  const p = { id: 'p' + Date.now(), name, ids: thenAdd ? [thenAdd] : [] };
  playlists.push(p);
  savePl();
  toast(`Created “${name}”`);
  render();
}

function more(id) {
  const s = byId(id);
  if (!s) return;
  const items = [
    ['Play Next', () => {
      queue.splice(qi + 1, 0, id);
      toast('Playing next');
    }],
    ['Add to Playlist', () => sheet('Add to Playlist', [
      ...playlists.map(p => [p.name, () => {
        if (!p.ids.includes(id)) { p.ids.push(id); savePl(); toast('Saved to ' + p.name); }
      }]),
      ['+ New Playlist', () => newPlaylist(id)]
    ])],
    [liked(id) ? 'Remove from Liked Songs' : 'Save to Liked Songs', () => toggleLike(id)]
  ];
  if (route.d && route.d.kind === 'playlist') {
    items.push(['Remove from this Playlist', () => {
      const p = playlists.find(p => p.id === route.d.key);
      if (p) { p.ids = p.ids.filter(x => x !== id); savePl(); render(); }
    }]);
  }
  items.push(['Delete track from device', () => {
    if (confirm(`Delete “${s.title}”? This removes it from local app storage.`)) removeSong(id);
  }]);
  sheet(s.title, items);
}

/* ---------- Views & Routing ---------- */
let route = { tab: 'home', lib: 'songs', d: null, q: '' }, lists = {};

const row = (s, l, i) => `
  <div class="row ${cur() && cur().id === s.id ? 'on' : ''}" data-l="${l}" data-i="${i}" data-id="${esc(s.id)}">
    ${art(s)}
    <div class="t">
      <b>${esc(s.title)}</b>
      <small>${esc(s.artist)}</small>
    </div>
    <button class="ic ${liked(s.id) ? 'liked' : ''}" data-like="${esc(s.id)}" aria-label="Like">${I.heart}</button>
    <button class="ic" data-more="${esc(s.id)}" aria-label="More">${I.more}</button>
  </div>`;

const card = (s, l, i) => `
  <button class="card" data-l="${l}" data-i="${i}">
    ${art(s)}
    <b>${esc(s.title)}</b>
    <small>${esc(s.artist)}</small>
  </button>`;

const group = key => {
  const m = new Map();
  songs.forEach(s => {
    const k = s[key] || 'Unknown';
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(s);
  });
  return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0]));
};

const sorted = () => [...songs].sort((a, b) => a.title.localeCompare(b.title));
const ids = arr => arr.map(s => s.id);

function empty() {
  return `
    <div class="empty">
      <h1>Your music, your phone</h1>
      <p>Add songs you own (MP3, M4A, FLAC, WAV) directly from the Files app. They stay stored on this device for offline playback.</p>
      <button class="btn" data-act="add">Add audio files</button>
    </div>`;
}

function home() {
  if (!songs.length) return empty();
  const hr = new Date().getHours();
  const recent = ls.get('recent', []).map(byId).filter(Boolean);
  const added = [...songs].sort((a, b) => b.added - a.added).slice(0, 15);
  lists.recent = ids(recent);
  lists.added = ids(added);

  const tiles = [
    `<button class="tile" data-open="liked" data-k="liked">${likeArt.replace('class="art"', 'class="art" style="border-radius:0;width:54px;height:54px"')}<span>Liked songs</span></button>`
  ]
  .concat(playlists.slice(0, 3).map(p => `<button class="tile" data-open="playlist" data-k="${p.id}">${art(byId(p.ids[0]))}<span>${esc(p.name)}</span></button>`))
  .concat(recent.slice(0, 4).map((s, i) => `<button class="tile" data-l="recent" data-i="${i}">${art(s)}<span>${esc(s.title)}</span></button>`))
  .slice(0, 6);

  return `
    <div class="head">
      <h1>${hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening'}</h1>
      <button class="ic" data-act="add" aria-label="Add songs" style="color:var(--ink)">${I.plus}</button>
    </div>
    <div class="grid">${tiles.join('')}</div>
    ${recent.length ? `<h2>Recently played</h2><div class="shelf">${recent.map((s, i) => card(s, 'recent', i)).join('')}</div>` : ''}
    <h2>Recently added</h2><div class="shelf">${added.map((s, i) => card(s, 'added', i)).join('')}</div>`;
}

function searchView() {
  return `
    <h1>Search</h1>
    <input class="search" id="q" placeholder="Search songs, artists, or albums" value="${esc(route.q)}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <div id="res"></div>`;
}

function results() {
  const q = route.q.toLowerCase().trim();
  const out = $('#res');
  if (!out) return;
  if (!q) { out.innerHTML = ''; return; }

  const m = sorted().filter(s => (s.title + ' ' + s.artist + ' ' + s.album).toLowerCase().includes(q));
  lists.res = ids(m);

  const ar = group('artist').filter(([k]) => k.toLowerCase().includes(q));
  const al = group('album').filter(([k]) => k.toLowerCase().includes(q));

  out.innerHTML = (m.length ? `<h2>Songs</h2>${m.slice(0, 30).map((s, i) => row(s, 'res', i)).join('')}` : '')
    + (ar.length ? `<h2>Artists</h2>${ar.map(([k, a]) => grow('artist', k, a)).join('')}` : '')
    + (al.length ? `<h2>Albums</h2>${al.map(([k, a]) => grow('album', k, a)).join('')}` : '')
    || '<p class="dim" style="margin-top:24px">No matching songs found in your library.</p>';
}

const grow = (kind, k, a) => `
  <div class="row ${kind === 'artist' ? 'round' : ''}" data-open="${kind}" data-k="${esc(k)}">
    ${art(a[0])}
    <div class="t">
      <b>${esc(k)}</b>
      <small>${a.length} track${a.length > 1 ? 's' : ''}</small>
    </div>
  </div>`;

function libView() {
  const chips = ['songs', 'playlists', 'artists', 'albums'].map(f => `
    <button class="chip ${route.lib === f ? 'on' : ''}" data-chip="${f}">${f[0].toUpperCase() + f.slice(1)}</button>
  `).join('');

  let body = '';
  if (!songs.length) return `<div class="head"><h1>Library</h1></div>${empty()}`;

  if (route.lib === 'songs') {
    const s = sorted();
    lists.all = ids(s);
    body = s.map((x, i) => row(x, 'all', i)).join('');
  } else if (route.lib === 'playlists') {
    body = `
      <div class="row" data-act="newpl"><div class="art" style="background:var(--card2)">+</div><div class="t"><b>Create playlist</b></div></div>
      <div class="row" data-open="liked" data-k="liked">${likeArt}<div class="t"><b>Liked Songs</b><small>${likes.length} songs</small></div></div>`
      + playlists.map(p => `<div class="row" data-open="playlist" data-k="${p.id}">${art(byId(p.ids[0]))}<div class="t"><b>${esc(p.name)}</b><small>${p.ids.length} songs</small></div></div>`).join('');
  } else {
    body = group(route.lib === 'artists' ? 'artist' : 'album').map(([k, a]) => grow(route.lib === 'artists' ? 'artist' : 'album', k, a)).join('');
  }

  return `
    <div class="head">
      <h1>Library</h1>
      <button class="ic" data-act="add" aria-label="Add songs" style="color:var(--ink)">${I.plus}</button>
    </div>
    <div class="chips">${chips}</div>
    ${body}`;
}

function detailView() {
  const { kind, key } = route.d;
  let title, list;
  if (kind === 'liked') {
    title = 'Liked songs';
    list = likes.map(byId).filter(Boolean);
  } else if (kind === 'playlist') {
    const p = playlists.find(p => p.id === key);
    if (!p) { route.d = null; return libView(); }
    title = p.name;
    list = p.ids.map(byId).filter(Boolean);
  } else {
    title = key;
    list = songs.filter(s => s[kind] === key);
  }
  lists.d = ids(list);

  return `
    <button class="back" data-act="back">‹ Back</button>
    ${kind === 'liked' ? likeArt.replace('class="art"', 'class="art cover"') : art(list[0], 'width:56%;max-width:210px;height:auto;aspect-ratio:1;margin:4px auto 16px;font-size:64px;border-radius:10px')}
    <h1 style="text-align:center">${esc(title)}</h1>
    <small style="text-align:center; margin-top:4px">${list.length} song${list.length === 1 ? '' : 's'}</small>
    <div class="btns" style="justify-content:center">
      <button class="btn" data-act="playall">Play</button>
      <button class="btn alt" data-act="shufall">Shuffle</button>
      ${kind === 'playlist' ? '<button class="btn alt" data-act="delpl">Delete</button>' : ''}
    </div>
    ${list.length ? list.map((s, i) => row(s, 'd', i)).join('') : '<p class="dim" style="text-align:center;margin-top:24px">No songs in this collection.</p>'}`;
}

function render() {
  const y = V.scrollTop;
  V.innerHTML = route.d ? detailView() : ({ home, search: searchView, lib: libView })[route.tab]();
  if (route.tab === 'search' && !route.d) {
    results();
    $('#q').oninput = e => { route.q = e.target.value; results(); };
  }
  $('#nav').innerHTML = [
    ['home', 'Home'],
    ['search', 'Search'],
    ['lib', 'Library']
  ].map(([t, n]) => `<button data-t="${t}" class="${route.tab === t ? 'on' : ''}">${I[t]}${n}</button>`).join('');
  V.scrollTop = y;
  paint();
}

const acts = {
  add: pickFiles,
  back: () => { route.d = null; render(); },
  newpl: () => newPlaylist(),
  playall: () => { if (lists.d.length) { shuffle = false; playQueue(lists.d, 0); } },
  shufall: () => { if (lists.d.length) { shuffle = true; playQueue(lists.d, Math.floor(Math.random() * lists.d.length)); } },
  delpl: () => {
    const p = playlists.find(p => p.id === route.d.key);
    if (confirm(`Delete “${p.name}”? Files remain in library.`)) {
      playlists = playlists.filter(x => x !== p);
      savePl();
      route.d = null;
      render();
    }
  }
};

V.addEventListener('click', e => {
  const t = e.target;
  let b;
  if (b = t.closest('[data-like]')) return toggleLike(b.dataset.like);
  if (b = t.closest('[data-more]')) return more(b.dataset.more);
  if (b = t.closest('[data-chip]')) { route.lib = b.dataset.chip; return render(); }
  if (b = t.closest('[data-open]')) { route.d = { kind: b.dataset.open, key: b.dataset.k }; V.scrollTop = 0; return render(); }
  if (b = t.closest('[data-act]')) return acts[b.dataset.act]();
  if (b = t.closest('[data-l]')) {
    const l = lists[b.dataset.l];
    if (l) playQueue(l, +b.dataset.i);
  }
});

$('#nav').addEventListener('click', e => {
  const t = e.target.closest('[data-t]')?.dataset.t;
  if (t) {
    route.tab = t;
    route.d = null;
    V.scrollTop = 0;
    render();
  }
});

document.querySelectorAll('[data-c="prev"]').forEach(b => b.innerHTML = I.prev);
document.querySelectorAll('[data-c="next"]').forEach(b => b.innerHTML = I.next);
$('#mTog').innerHTML = $('#nTog').innerHTML = I.play;
$('#bShuf').innerHTML = I.shuf;
$('#bRep').innerHTML = I.rep;
$('#npClose').innerHTML = I.down;
$('#npQueue').innerHTML = I.queue;
$('#nLike').innerHTML = I.heart;

(async function boot() {
  try {
    db = await openDB();
    const stored = await tx('songs', 'readonly', t => t.objectStore('songs').getAll()) || [];
    songs = stored.map(withUrl);
  } catch (e) {
    V.innerHTML = `
      <div class="empty">
        <h1>Storage Restricted</h1>
        <p>Murmur requires offline browser database storage to function. Check that Private Browsing mode is turned off.</p>
      </div>`;
    return;
  }
  render();
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }
})();
</script>
</body>
</html>
